<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/web/pwa/icon-180.png">
<meta name="theme-color" content="#2d6173">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EasyRead">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/web/js/common/pwa-window.js"></script>
<link rel="stylesheet" href="/web/css/pwa.css">
<script src="/web/js/common/desktop-bridge.js"></script>
<title data-i18n-title>研究探索｜EasyRead</title>
<link rel="icon" href="/web/favicon.svg">
<link rel="stylesheet" href="/web/css/base.css">
<link rel="stylesheet" href="/web/css/dropdown.css">
<link rel="stylesheet" href="/web/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/web/css/research-workspace.css">
<link rel="stylesheet" href="/web/css/research-task-monitor.css">
<script>try{var p=JSON.parse((localStorage.getItem("easyread-prefs")||localStorage.getItem("coread-prefs"))||"{}");var d=p.theme==="dark"||(p.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light"}catch(e){}</script>
</head>
<body class="research-workspace">
<header class="topbar">
  <a class="brand" href="/"><img class="mark" src="/web/favicon.svg" width="26" height="26" alt=""><span>Easy<b>Read</b></span></a>
  <span class="crumb">研究探索</span><span class="grow"></span>
  <button class="btn icon lang-btn" id="langBtn"></button><a class="btn line" href="/">返回文献库</a>
</header>
<main class="rw-shell">
  <section class="rw-heading"><div><p class="eyebrow">个人研究工作区</p><h1>研究探索</h1><p>探索研究方向、保存候选论文，逐步建立阅读脉络。</p></div></section>
  <nav class="rw-tabs" role="tablist">
    <button class="on" data-tab="board">阅读看板 <span data-count="active"></span></button><button data-tab="explore">研究探索</button><button data-tab="candidates">候选清单 <span data-count="candidates"></span></button><button data-tab="summaries">已整理摘要 <span data-count="summaries"></span></button><button data-tab="retrieval">跨论文检索</button><button data-tab="comparisons">论文比较</button><button data-tab="keywords">关键字</button><button data-tab="progress">研究进度</button><button data-tab="path">阅读路径</button>
  </nav>
  <section id="rw-alerts" aria-live="polite"></section>
  <section class="rw-view" data-view="explore" hidden></section>
  <section class="rw-view" data-view="board"><div class="rw-empty" role="status"><i class="spin"></i> 载入研究工作区中…</div></section>
  <section class="rw-view" data-view="candidates" hidden></section>
  <section class="rw-view" data-view="summaries" hidden></section>
  <section class="rw-view" data-view="retrieval" hidden></section>
  <section class="rw-view" data-view="comparisons" hidden></section>
  <section class="rw-view" data-view="keywords" hidden></section>
  <section class="rw-view" data-view="progress" hidden></section>
  <section class="rw-view" data-view="path" hidden></section>
</main>
<div id="rw-modal" class="rw-modal" hidden></div>
<div id="rw-quick-peek-scrim" class="rw-quick-peek-scrim" aria-hidden="true"></div>
<aside id="rw-quick-peek" class="rw-quick-peek" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="rw-quick-peek-title" tabindex="-1"></aside>
<div id="toast" role="status"></div>
<script src="/web/js/common/i18n.js"></script>
<script src="/web/js/common/util.js"></script>
<script src="/web/js/common/ai-language.js"></script>
<script src="/web/js/common/clipboard.js"></script>
<script src="/web/js/common/confirm.js"></script>
<script src="/web/js/common/pick-folder.js"></script>
<script src="/web/js/common/dropdown.js"></script>
<script src="/web/js/common/presence.js"></script>
<script src="/web/js/common/theme.js"></script>
<script src="/web/js/common/lang-toggle.js"></script>
<script src="/web/vendor/katex/katex.min.js"></script>
<script src="/web/vendor/markdown-it.js"></script>
<script src="/web/js/common/markup.js"></script>
<script src="/web/js/research/retrieval.js"></script>
<script src="/web/js/research/progress.js"></script>
<script src="/web/js/research/path-map.js"></script>
<script src="/web/js/common/import-tasks.js"></script>
<script src="/web/js/common/research-task-monitor.js"></script>
<script src="/web/js/research/citations.js"></script>
<script src="/web/js/research/keyword-map.js"></script>
<script src="/web/js/research/summary-editor.js"></script>
<script src="/web/js/research/workspace.js"></script>
</body>
</html>
