<script>try{var p=JSON.parse((localStorage.getItem("easyread-prefs")||localStorage.getItem("coread-prefs"))||"{}");var d=p.theme==="dark"||(p.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light"}catch(e){}</script>

<body>
<div id="progress" aria-hidden="true"><i></i></div>

<header class="topbar" id="bar">
  <a class="btn brand-back" id="backBtn" href="/" title="回文献库"></a>
  <a class="btn citation-return" id="citationBack" hidden></a>
  <button class="btn icon" data-act="drawer" title="目录（T）"></button>
  <div class="bar-titles">
    <span class="bar-title"></span>
    <span class="bar-section"></span>
  </div>
  <span class="grow"></span>
  <span class="job-state" id="jobState"></span>
  <div class="seg view-seg" role="group" aria-label="正文显示">
    <button data-view="original"></button>
    <button data-view="translation"></button>
    <button data-view="both"></button>
    <button class="order-caret" data-order-menu aria-haspopup="menu" aria-expanded="false"></button>
  </div>
  <button class="btn" data-act="dock" aria-controls="readerDock" aria-expanded="false" disabled>侧栏</button>
  <button class="btn ink-toggle" id="inkToggle" aria-pressed="false" title="手写注记（W）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M13.8 3.2l3 3-8.7 8.7-3.8.8.8-3.8zM3.5 17h13"></path></svg><span>手写</span></button>
  <button class="btn" id="stickerToggle" type="button" aria-expanded="false" aria-controls="stickerPanel" title="贴纸素材库（S）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h12v9l-4 4H4zM12 16.5v-4h4"></path></svg><span>贴纸</span></button>
  <button class="btn" data-act="research">研究</button>
  <button class="btn" data-act="settings" title="字号、版心、字体（=、- 调字号）">Aa</button>
  <span class="save-state" role="status" title="保存状态"><i aria-hidden="true"></i><span>…</span></span>
</header>

<aside id="drawer" aria-label="目录">
  <div class="drawer-tabs" role="tablist">
    <button data-tab="toc" class="on">目录</button>
    <button data-tab="terms">术语</button>
    <button data-tab="citations" class="server-only">引用</button>
    <button data-tab="about">说明</button>
    <button data-tab="recent" class="server-only">最近</button>
  </div>
  <div class="drawer-body"></div>
</aside>
<div id="scrim"></div>

<main id="stage">
  <article id="paper" lang="zh-CN"></article>
  <aside id="margin" aria-label="讨论与笔记"></aside>
  <svg id="inkLayer" aria-label="手写注记画布"></svg>
</main>

<div id="inkTools" role="toolbar" aria-label="手写工具" hidden>
  <button type="button" data-ink-input aria-pressed="false"></button>
  <div class="ink-tool-group" role="group" aria-label="笔色">
    <button type="button" class="ink-swatch" data-ink-color="#1d1d1d" aria-label="黑笔" title="黑笔" aria-pressed="true"><i></i></button>
    <button type="button" class="ink-swatch" data-ink-color="#d94b4b" aria-label="红笔" title="红笔"><i></i></button>
    <button type="button" class="ink-swatch" data-ink-color="#2878c8" aria-label="蓝笔" title="蓝笔"><i></i></button>
    <button type="button" class="ink-swatch" data-ink-color="#27845b" aria-label="绿笔" title="绿笔"><i></i></button>
    <label class="ink-swatch ink-custom" title="自订颜色"><input type="color" data-ink-custom value="#6d5bd0" aria-label="自订颜色"><i></i></label>
  </div>
  <details class="ink-width" id="inkWidth">
    <summary title="笔宽"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 14.5h12M6.5 10h7M8.5 5.5h3"></path></svg><span>笔宽</span></summary>
    <label><span>笔宽</span><input type="range" data-ink-width min="1" max="12" step="1" value="2" aria-label="笔宽"></label>
  </details>
  <span class="ink-tool-divider" aria-hidden="true"></span>
  <div class="ink-width ink-eraser"><button type="button" class="ink-action" data-ink-erase aria-pressed="false" aria-expanded="false" aria-controls="eraserSize" title="橡皮擦（X）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 16H5l-3-3a1.5 1.5 0 0 1 0-2l9-9a1.5 1.5 0 0 1 2 0l4 4a1.5 1.5 0 0 1 0 2L9 16M6 7l7 7M8 16h10"></path></svg><span>橡皮擦</span></button><label id="eraserSize" data-eraser-size hidden><span>橡皮擦大小</span><input type="range" data-eraser-width min="8" max="80" step="2" value="24" aria-label="橡皮擦大小"></label></div>
  <button type="button" class="ink-action" data-ink-lasso aria-pressed="false" title="套索选取"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="8" rx="7.5" ry="5" stroke-dasharray="2.5 2"></ellipse><path d="M6 12c-2 1-3 4-1 5 2 1 4-1 3-3-.4-.8-1-1.4-2-2"></path></svg><span>套索选取</span></button>
  <button type="button" class="ink-action" data-ink-text aria-pressed="false" title="插入文字方块"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5V3h14v2M10 3v14M7 17h6"></path></svg><span>插入文字方块</span></button>
  <button type="button" class="ink-action" data-ink-undo title="复原（Ctrl/⌘ + Z）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3L3 7l4 4M3 7h9a5 5 0 0 1 0 10h-2"></path></svg><span>复原</span></button>
  <button type="button" class="ink-action" data-ink-redo title="重做（Ctrl/⌘ + Shift + Z）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3l4 4-4 4m4-4h-9a5 5 0 0 0 0 10h2"></path></svg><span>重做</span></button>
  <button type="button" class="ink-action" data-ink-hide aria-pressed="false" title="隐藏笔迹"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10s2.7-4.5 7.5-4.5S17.5 10 17.5 10 14.8 14.5 10 14.5 2.5 10 2.5 10zM10 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg><span data-ink-hide-label>隐藏笔迹</span></button>
  <button type="button" class="ink-action ink-done" data-ink-close title="结束手写"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8"></path></svg><span>完成</span></button>
</div>

<section id="stickerPanel" role="dialog" aria-label="贴纸素材库" hidden></section>
<div id="stickerTools" role="toolbar" aria-label="贴纸工具" hidden></div>
<section id="pageview" class="side-panel" aria-label="PDF 原页">
  <div class="pv-head">
    <button class="btn icon" data-pv="prev" title="上一页（[）">‹</button>
    <span class="pv-label"></span>
    <button class="btn icon" data-pv="next" title="下一页（]）">›</button>
    <span class="grow"></span>
    <label class="pv-follow" title="左右双向跟随阅读位置"><input type="checkbox" checked> 跟随</label>
    <a class="btn sm" data-pv="pdf" target="_blank" rel="noopener">PDF</a>
    <button class="btn icon" data-pv="close" title="关闭（O）">×</button>
  </div>
  <div class="pv-zoom" role="group" aria-label="PDF 缩放">
    <button class="btn icon" data-pv-zoom="out" title="缩小 PDF">−</button>
    <span class="pv-zoom-value" aria-live="polite">100%</span>
    <button class="btn icon" data-pv-zoom="in" title="放大 PDF">+</button>
    <button class="btn sm" data-pv-zoom="fit" title="恢复适合宽度">适合宽度</button>
  </div>
  <div class="pv-scroll"><div class="pv-page"><img alt=""><div class="pv-hl"></div></div></div>
</section>

<section id="notespanel" class="side-panel" aria-label="笔记"></section>
<section id="chatpanel" class="side-panel" aria-label="问 AI"></section>
<section id="researchpanel" class="side-panel" aria-label="研究知识工作区"></section>
<aside id="readerDock" aria-label="阅读侧栏" hidden></aside>
<div class="dialog-backdrop" id="readerDlg"><div class="dialog" role="dialog"></div></div>
<div class="dialog-backdrop" id="settingsDlg"><div class="dialog" role="dialog" aria-label="设置"></div></div>
<div class="dialog-backdrop" id="textDlg"><div class="dialog wide" role="dialog"></div></div>

<div class="dialog-backdrop" id="mindmapDlg"><div class="dialog mm-dialog" role="dialog" aria-label="论文心智图"></div></div>
<div class="dialog-backdrop" id="deepReportDlg"><div class="dialog deep-dialog" role="dialog" aria-label="论文深度剖析报告"></div></div>

<div id="settings" class="menu" role="dialog" aria-label="阅读设置"></div>
<div id="popover" class="popover" role="tooltip"></div>
<div id="selbar" class="popover" role="toolbar"></div>
<div id="blockbar" class="popover" role="toolbar"></div>
<div id="toast" role="status"></div>
