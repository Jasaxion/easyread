<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/web/pwa/icon-180.png">
<meta name="theme-color" content="#2d6173">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EasyRead">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/web/js/common/pwa-window.js"></script>
<link rel="stylesheet" href="/web/css/pwa.css">
<meta name="color-scheme" content="light dark">
<title data-i18n-title>EasyRead · 访问授权</title>
<link rel="icon" href="/web/favicon.svg">
<link rel="stylesheet" href="/web/css/access.css">
<script src="/web/js/common/access.js" defer></script>
</head>
<body>
<header class="access-top"><a class="access-brand" href="/"><img src="/web/favicon.svg" alt="" width="30" height="30">Easy<span>Read</span></a><select id="accessLang" aria-label="界面语言"><option value="zh" translate="no">简体中文</option><option value="zh-Hant" translate="no">繁体中文</option><option value="en" translate="no">English</option></select></header>
<main class="access-shell">
  <section class="access-story" aria-hidden="true">
    <span class="access-eyebrow">A QUIET PLACE FOR YOUR IDEAS</span>
    <h1 data-zh="把好奇留给论文。" data-en="Stay curious. Read deeply.">把好奇留给论文。</h1>
    <p data-zh="阅读、理解、记录。让每一个想法，都有值得停留的地方。" data-en="Read, understand, and make it yours. A thoughtful space for the ideas worth keeping.">阅读、理解、记录。让每一个想法，都有值得停留的地方。</p>
    <div class="access-art"><div class="art-orbit"></div><div class="art-page page-back"></div><div class="art-page page-front"><i class="page-label">FIELD NOTES / 01</i><b>Ideas take shape<br>one page at a time.</b><span></span><span></span><span class="mark-line"></span><span></span><em>read · reflect · connect</em></div><div class="art-note">a little clarity,<br>every day. <i>↗</i></div></div>
    <span class="access-caption" data-zh="你的文献，你的思考空间。" data-en="Your papers. Your space to think.">你的文献，你的思考空间。</span>
  </section>
  <section class="access-card">
    <div class="access-lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
    <span class="access-eyebrow" data-zh="私人阅读空间" data-en="YOUR PRIVATE READING SPACE">私人阅读空间</span>
    <h2 data-zh="欢迎回来" data-en="Welcome back">欢迎回来</h2>
    <p class="access-description" data-zh="输入访问授权码，继续你的阅读。" data-en="Enter your access code to pick up where you left off.">输入访问授权码，继续你的阅读。</p>
    <form id="accessForm">
      <label for="accessCode" data-zh="访问授权码" data-en="Access code">访问授权码</label>
      <div class="access-input"><input id="accessCode" type="password" autocomplete="current-password" required maxlength="256" autofocus placeholder="输入访问授权码"><button type="button" id="toggleCode" aria-label="显示授权码">◉</button></div>
      <p id="accessError" role="alert" aria-live="polite"></p>
      <button class="access-submit" id="accessSubmit" type="submit"><span data-zh="进入 EasyRead" data-en="Open EasyRead">进入 EasyRead</span><span aria-hidden="true">→</span></button>
    </form>
    <div class="access-help"><span aria-hidden="true">◇</span><p data-zh="授权码由此空间的拥有者设置，不是模型账号或 API Key。" data-en="This code is set by the workspace owner. It is not a model account password or API key.">授权码由此空间的拥有者设置，不是模型账号或 API Key。</p></div>
  </section>
</main>
<footer class="access-footer">EasyRead <span>·</span> Read at your own pace.</footer>
</body>
</html>
