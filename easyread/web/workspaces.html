<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title>研究空间｜EasyRead</title>
<link rel="icon" href="/web/favicon.svg">
<link rel="stylesheet" href="/web/css/base.css">
<link rel="stylesheet" href="/web/css/research-task-monitor.css">
<link rel="stylesheet" href="/web/css/dropdown.css">
<link rel="stylesheet" href="/web/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/web/css/reader-chat.css">
<link rel="stylesheet" href="/web/css/chat-images.css">
<link rel="stylesheet" href="/web/css/workspaces.css">
<link rel="stylesheet" href="/web/css/workspace-beads.css">
<link rel="stylesheet" href="/web/css/workspace-servers.css">
<link rel="stylesheet" href="/web/css/workspace-reading.css">
<link rel="stylesheet" href="/web/vendor/workspace-pdf.css">
<script src="/web/js/common/desktop-bridge.js"></script>
<script>try{var p=JSON.parse((localStorage.getItem("easyread-prefs")||localStorage.getItem("coread-prefs"))||"{}");var d=p.theme==="dark"||(p.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light"}catch(e){}</script>
</head>
<body class="workspaces-page">
<header class="topbar">
  <a class="brand" href="/" title="回文献库" aria-label="回文献库"><img class="mark" src="/web/favicon.svg" width="26" height="26" alt=""><span>Easy<b>Read</b></span></a>
  <a class="btn line" id="ws-back" href="/workspaces" hidden>研究项目</a>
  <span class="crumb" id="ws-project-name">研究空间</span>
  <div id="ws-remote-status" class="ws-remote-status" role="status" hidden><span id="ws-remote-target"></span><span id="ws-remote-state"></span><button class="btn sm line" id="ws-remote-connect" hidden>重新连接</button></div>
  <span class="grow"></span>
  <div id="ws-latex-toolbar" class="ws-latex-controls" hidden>
    <button class="btn sm accent" id="ws-compile" title="保存并编译">重新编译</button>
    <button class="btn sm line" id="ws-compile-cancel" hidden>停止编译</button>
    <span id="ws-compile-status" role="status"></span>
    <button class="btn sm line" id="ws-latex-settings" title="编译与编辑设置" aria-expanded="false" aria-controls="ws-latex-settings-popover">设置</button>
    <section id="ws-latex-settings-popover" class="ws-settings-popover" aria-label="编译与编辑设置" hidden>
      <label class="ws-field"><span>主文件</span><select id="ws-latex-main" class="input"></select></label>
      <label class="ws-field"><span>编译引擎</span><select id="ws-latex-engine" class="input"></select></label>
      <label class="ws-field"><span>编辑器字号</span><input id="ws-latex-font-size" class="input" type="number" min="10" max="22" step="1" value="12"></label>
      <p class="hint">LaTeX 文件始终自动保存；字号不影响阅读器或 PDF。</p>
      <p id="ws-latex-settings-status" class="hint" role="status"></p>
    </section>
  </div>
  <nav class="ws-project-nav" id="ws-project-nav" aria-label="项目工具" hidden>
    <button class="btn sm" id="ws-files-toggle" title="项目文件" aria-pressed="true">项目文件</button>
    <button class="btn sm" id="ws-papers-toggle" title="关联文献" aria-pressed="true">关联文献</button>
    <button class="btn sm ws-icon-button" id="ws-beads-toggle" title="Beads 项目管理" aria-label="Beads 项目管理" aria-haspopup="dialog" aria-expanded="false" aria-controls="ws-beads-panel"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="2"/><path d="M7.5 3v14M12.5 3v14M4.5 6h1M9.5 6h1M9.5 9h1M14.5 6h1M14.5 9h1M14.5 12h1"/></svg></button>
    <button class="btn sm line" id="ws-view-toggle">LaTeX 编辑器</button>
    <button class="btn sm line" id="ws-companion-toggle" hidden>问 AI</button>
    <button class="btn sm line" id="ws-mobile-focus" hidden>问 AI</button>
    <button class="btn sm" id="ws-project-menu" title="项目操作">项目操作</button>
  </nav>
  <a class="btn line ws-global-link" id="ws-research-link" href="/research">研究探索</a><a class="btn line ws-global-link" id="ws-library-link" href="/">返回文献库</a>
  <button class="btn icon lang-btn" id="langBtn"></button>
</header>
<div id="ws-alert" class="ws-alert" role="alert" hidden></div>
<main id="ws-projects" class="ws-projects">
  <header class="ws-projects-heading"><div><p class="eyebrow">RESEARCH WORKSPACE</p><h1>研究空间</h1><p class="hint">让论文、研究文件和原生 AI 会话汇聚一处。</p></div><div class="ws-row ws-wrap"><button class="btn line" id="ws-servers">SSH 服务器</button><button class="btn line" id="ws-project-import">导入项目</button><button class="btn accent" id="ws-project-new">新建研究项目</button></div></header>
  <div class="ws-row ws-projects-tools"><h2 id="ws-project-count">研究项目</h2><input class="input" id="ws-project-search" type="search" placeholder="搜索项目名称或简介" aria-label="搜索项目名称或简介"></div>
  <section id="ws-project-list" aria-live="polite"><div class="ws-empty">正在载入…</div></section>
  <input id="ws-import-input" type="file" accept=".zip,application/zip" hidden>
</main>
<section id="ws-workspace" hidden>
  <div class="ws-layout" id="ws-layout">
    <button class="ws-sidebar-backdrop" id="ws-sidebar-backdrop" aria-label="关闭项目导航" tabindex="-1" hidden></button>
    <aside class="ws-sidebar" id="ws-sidebar">
      <div class="ws-sidebar-mobile-heading"><strong>项目导航</strong><button class="btn sm" id="ws-sidebar-close">关闭</button></div>
      <section class="ws-sidebar-section" id="ws-files-section">
        <div class="ws-section-heading"><button class="btn sm" id="ws-files-collapse" aria-expanded="true">项目文件</button><span class="grow"></span><button class="btn sm" id="ws-file-new" title="新建文件">新建文件</button><button class="btn sm" id="ws-folder-new" title="新建文件夹">新建文件夹</button><button class="btn sm" id="ws-upload" title="上传">上传</button><button class="btn sm" id="ws-latex-import" title="导入 LaTeX ZIP" aria-label="导入 LaTeX ZIP" hidden>ZIP</button></div>
        <div id="ws-tree" class="ws-tree" aria-label="项目文件"></div>
        <input type="file" id="ws-upload-input" multiple hidden><input type="file" id="ws-latex-import-input" accept=".zip,application/zip" hidden>
      </section>
      <section class="ws-sidebar-section ws-papers-section" id="ws-papers-section">
        <div class="ws-section-heading"><button class="btn sm" id="ws-papers-collapse" aria-expanded="true">关联文献 <span id="ws-paper-count"></span></button><span class="grow"></span><button class="btn sm" id="ws-paper-add">关联论文</button></div>
        <div id="ws-papers" class="ws-papers"></div>
      </section>
    </aside>
    <div class="ws-split" id="ws-sidebar-split" aria-label="调整侧栏宽度"></div>
    <div class="ws-content" id="ws-content">
      <section class="ws-file-pane" id="ws-file-pane" hidden>
        <header class="ws-file-heading"><strong id="ws-file-title"></strong><span id="ws-file-status" role="status"></span><span id="ws-file-heading-tools" class="ws-file-heading-tools"></span><div class="ws-file-tools"><button class="btn sm accent" id="ws-save">保存</button><button class="btn sm" id="ws-preview-toggle">源码 / 预览</button><button class="btn sm" id="ws-editor-settings" title="编辑器设置" aria-expanded="false" aria-controls="ws-editor-settings-popover">编辑器设置</button></div><button class="btn sm" id="ws-source-locate" title="在 PDF 中定位（Ctrl/⌘ + Shift + Enter）" hidden>在 PDF 中定位</button><button class="btn sm" id="ws-close-file" title="关闭文件预览">×</button></header>
        <section id="ws-editor-settings-popover" class="ws-settings-popover" aria-label="编辑器设置" hidden><label class="ws-field"><span>编辑器字号 <output id="ws-editor-font-value" for="ws-editor-font-size">13px</output></span><input id="ws-editor-font-size" aria-label="编辑器字号" type="range" min="10" max="22" step="1" value="13"></label><label class="ws-autosave-option"><input type="checkbox" id="ws-autosave"> 自动保存</label><button class="btn sm line" id="ws-goto-line">跳转到行</button></section>
        <div class="ws-conflict" id="ws-conflict" role="status" hidden><p id="ws-conflict-text"></p><div class="ws-row ws-wrap"><button class="btn sm line" id="ws-show-remote">比较服务器版本</button><button class="btn sm line" id="ws-save-copy">另存副本</button><button class="btn sm line" id="ws-reload-file">重新载入</button></div></div>
        <div id="ws-editor" class="ws-editor"></div><div id="ws-file-preview" class="ws-file-preview ws-markdown" hidden></div>
      </section>
      <div class="ws-split" id="ws-editor-split" aria-label="调整源码与预览宽度" hidden></div>
      <div class="ws-companion" id="ws-companion">
        <section class="ws-chat" id="ws-chat">
          <div class="ws-chat-heading"><strong id="ws-chat-label">问 AI</strong><select class="input" id="ws-session-select" aria-label="原生会话"></select><span class="sr-only" id="ws-session-status" role="status"></span><button class="btn sm" id="ws-session-new">新建会话</button><button class="btn sm line" id="ws-terminal" aria-pressed="false" aria-controls="ws-terminal-frames">原生终端</button><button class="btn sm line" id="ws-terminal-stop" hidden>停止并关闭终端</button><button class="btn sm" id="ws-session-menu">会话操作</button></div>
          <p class="hint ws-terminal-note" id="ws-terminal-note" hidden></p>
          <div id="ws-terminal-frames" class="ws-terminal-frames" hidden></div>
          <div id="ws-session-gui" class="ws-session-gui">
          <section class="ws-goal" id="ws-goal" aria-label="原生目标" hidden>
            <div class="ws-row ws-wrap"><strong id="ws-goal-state"></strong><div class="ws-goal-actions"><button class="btn sm line" id="ws-goal-pause">暂停目标</button><button class="btn sm line" id="ws-goal-resume">恢复目标</button><button class="btn sm" id="ws-goal-clear">清除目标</button></div></div>
            <p id="ws-goal-objective"></p>
          </section>
          <p class="hint ws-session-notice" id="ws-session-notice" hidden></p>
          <div class="ws-history-tools" id="ws-history-tools" hidden><button class="btn sm" id="ws-history-older">加载更早记录</button><button class="btn sm line" id="ws-history-latest" hidden>回到最新记录</button><span class="hint" id="ws-history-status" role="status"></span></div>
          <div class="ws-messages" id="ws-messages" aria-label="会话消息" aria-live="polite"></div>
          <section class="ws-requests" id="ws-requests" aria-label="待处理请求" hidden></section>
          <details class="ws-pending-inputs" id="ws-pending-inputs" hidden><summary id="ws-pending-inputs-summary"></summary><div id="ws-pending-inputs-list"></div></details>
          <form class="ws-composer" id="ws-chat-form">
            <div id="ws-file-chips" class="ws-file-chips" aria-label="引用文件" hidden></div>
            <div id="ws-mentions" class="ws-mentions" role="listbox" aria-label="选择项目文件" hidden></div>
            <div id="ws-commands" class="ws-mentions ws-commands" role="listbox" aria-label="选择命令或 Skill" hidden></div>
            <div id="ws-images"></div><div id="ws-image-status" class="hint" role="status"></div>
            <label class="sr-only" for="ws-message">向 AI 提问</label>
            <textarea class="input" id="ws-message" rows="3" placeholder="提问，或输入 @ 引用文件、/ 命令、$ Skill…" aria-controls="ws-mentions" aria-expanded="false" aria-autocomplete="list"></textarea>
            <div class="ws-composer-actions"><button class="btn sm" id="ws-attach-file" type="button" title="引用文件">引用文件</button><button class="btn sm" id="ws-command-menu" type="button" title="命令与 Skills" aria-label="命令与 Skills">/</button><select class="input ws-session-mode" id="ws-session-mode" aria-label="会话模式"><option value="chat">普通执行</option><option value="goal">原生目标</option></select><span class="grow"></span><span class="ws-turn-actions"><button class="btn sm line" id="ws-steer" type="button" hidden>引导</button><button class="btn accent" id="ws-send" type="submit" title="发送"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg><span class="sr-only" id="ws-send-label">发送</span></button><button class="btn sm line" id="ws-cancel" type="button" title="停止" hidden>停止</button></span></div>
            <span class="sr-only ws-keyboard-hint">Enter 发送 · Shift + Enter 换行</span>
          </form>
          </div>
        </section>
        <section class="ws-pdf-pane" id="ws-pdf-pane" hidden>
          <header class="ws-pdf-heading">
            <div id="ws-pdf-controls" class="ws-pdf-controls">
              <button class="btn sm" id="ws-pdf-prev" title="上一页">‹</button>
              <input id="ws-pdf-page" class="input" type="number" min="1" value="1" aria-label="PDF 页码"><span id="ws-pdf-pages">/ 0</span>
              <button class="btn sm" id="ws-pdf-next" title="下一页">›</button>
              <button class="btn sm" id="ws-pdf-zoom-out" title="缩小">−</button>
              <input id="ws-pdf-zoom" class="input" type="number" min="25" max="400" step="10" value="100" aria-label="PDF 缩放百分比"><span>%</span>
              <button class="btn sm" id="ws-pdf-zoom-in" title="放大">+</button>
              <button class="btn sm" id="ws-pdf-fit" title="适合宽度">适合宽度</button>
            </div>
            <span class="grow"></span><button class="btn sm line" id="ws-latex-log-toggle" aria-pressed="false">编译日志</button>
            <a id="ws-pdf-download" class="btn sm line" download hidden title="导出 PDF">导出 PDF</a>
          </header>
          <p id="ws-sync-status" class="ws-sync-status" role="status" hidden></p>
          <div class="ws-empty" id="ws-pdf-empty">保存并编译后，在此预览 PDF。编译失败时不会展示过期结果。</div>
          <div id="ws-pdf" class="ws-pdf-viewer" tabindex="0" aria-label="PDF 预览" hidden></div>
          <section id="ws-latex-log" class="ws-latex-log" aria-label="编译日志" hidden><div id="ws-latex-errors"></div><pre id="ws-latex-log-text"></pre></section>
        </section>
      </div>
    </div>
  </div>
</section>
<aside id="ws-paper-popover" class="ws-paper-popover" role="dialog" aria-label="论文详情" hidden></aside>
<div id="toast" role="status"></div>
