services:
  easyread:
    image: easyread:local
    build:
      context: .
      target: full
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.309}
        CODEX_VERSION: ${CODEX_VERSION:-0.169.0}
        BEADS_VERSION: ${BEADS_VERSION:-1.3.4}
        DOLT_VERSION: ${DOLT_VERSION:-2.7.5}
        DOLT_SHA256: ${DOLT_SHA256:-}
        TEXLIVE_PACKAGES: ${EASYREAD_TEXLIVE_PACKAGES:-texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-xetex texlive-luatex texlive-lang-chinese texlive-bibtex-extra latexmk biber}
        PIP_INDEX_URL: ${EASYREAD_PIP_INDEX_URL:-https://pypi.org/simple}
        NO_PROXY: ${EASYREAD_BUILD_NO_PROXY:-localhost,127.0.0.1,.aliyun.com,.tsinghua.edu.cn}
        no_proxy: ${EASYREAD_BUILD_NO_PROXY:-localhost,127.0.0.1,.aliyun.com,.tsinghua.edu.cn}
        HTTP_PROXY: ${EASYREAD_BUILD_PROXY:-}
        HTTPS_PROXY: ${EASYREAD_BUILD_PROXY:-}
        http_proxy: ${EASYREAD_BUILD_PROXY:-}
        https_proxy: ${EASYREAD_BUILD_PROXY:-}
    init: true
    ports:
      - "${EASYREAD_BIND_IP:-127.0.0.1}:${EASYREAD_PORT:-8765}:8765"
    environment:
      EASYREAD_HOME: /data/EasyRead
      EASYREAD_HOST: 0.0.0.0
      EASYREAD_PORT: "8765"
      EASYREAD_TERMINAL: "1"
      EASYREAD_TEX_TIMEOUT: ${EASYREAD_TEX_TIMEOUT:-120}
      EASYREAD_WORKSPACE_MAX_ACTIVE: ${EASYREAD_WORKSPACE_MAX_ACTIVE:-4}
      EASYREAD_WORKSPACE_MAX_RUNTIMES: ${EASYREAD_WORKSPACE_MAX_RUNTIMES:-8}
      EASYREAD_WORKSPACE_IDLE_GRACE: ${EASYREAD_WORKSPACE_IDLE_GRACE:-300}
      EASYREAD_WORKSPACE_TURN_TIMEOUT: ${EASYREAD_WORKSPACE_TURN_TIMEOUT:-0}
      # Optional first-run code. Afterwards, manage it in Settings → Access.
      EASYREAD_ACCESS_CODE: ${EASYREAD_ACCESS_CODE:-}
      EASYREAD_ACCESS_COOKIE: ${EASYREAD_ACCESS_COOKIE:-easyread_session}
      EASYREAD_ALLOWED_HOSTS: ${EASYREAD_ALLOWED_HOSTS:-}
      HTTP_PROXY: ${EASYREAD_HTTP_PROXY:-}
      HTTPS_PROXY: ${EASYREAD_HTTPS_PROXY:-}
      http_proxy: ${EASYREAD_HTTP_PROXY:-}
      https_proxy: ${EASYREAD_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1,easyread,host.docker.internal
    volumes:
      - easyread-data:/data/EasyRead
      - easyread-cli-home:/home/easyread
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - seccomp:./docker/seccomp-chromium.json
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  easyread-data:
  easyread-cli-home:
