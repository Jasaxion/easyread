# Lite includes the Python/MCP runtime, not Agent CLIs, Git/bd/Dolt or TeX.
# Capability diagnostics explain missing tools; switch to full for the complete
# research workspace. See docs/research-workspaces.en.md.
services:
  easyread:
    build:
      context: .
      target: lite
      args:
        PIP_INDEX_URL: ${EASYREAD_PIP_INDEX_URL:-https://pypi.org/simple}
        HTTP_PROXY: ${EASYREAD_BUILD_PROXY:-}
        HTTPS_PROXY: ${EASYREAD_BUILD_PROXY:-}
        http_proxy: ${EASYREAD_BUILD_PROXY:-}
        https_proxy: ${EASYREAD_BUILD_PROXY:-}
        NO_PROXY: ${EASYREAD_BUILD_NO_PROXY:-localhost,127.0.0.1,.aliyun.com,.tsinghua.edu.cn}
        no_proxy: ${EASYREAD_BUILD_NO_PROXY:-localhost,127.0.0.1,.aliyun.com,.tsinghua.edu.cn}
    image: easyread-lite:local
    init: true
    ports:
      - "127.0.0.1:${EASYREAD_PORT:-8765}:8765"
    environment:
      EASYREAD_HOME: /data/EasyRead
      EASYREAD_HOST: 0.0.0.0
      EASYREAD_PORT: "8765"
      EASYREAD_ACCESS_CODE: ${EASYREAD_ACCESS_CODE:-}
      EASYREAD_ACCESS_COOKIE: ${EASYREAD_ACCESS_COOKIE:-easyread_session}
      EASYREAD_ALLOWED_HOSTS: ${EASYREAD_ALLOWED_HOSTS:-}
      EASYREAD_TEX_TIMEOUT: ${EASYREAD_TEX_TIMEOUT:-120}
    volumes:
      - easyread-data:/data/EasyRead
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  easyread-data:
